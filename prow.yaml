# Organization-wide Prow configuration for projectbluefin.
# Read by cncf/prow-github-actions from <org>/.project/prow.yaml for every repository.
# Upstream reference: https://github.com/cncf/prow-github-actions/blob/v3.0.1/docs/configuration.md
#
# Rule: a label exists here only if something acts on it (Prow commands, merge gate or
# needs-* rule, or the Hive work queue). After any change, run Actions -> Prow -> Run workflow (label-sync)
# in each repository.
labels:
  kind:
    - name: bug
      color: e11d21
      description: Something is broken.
    - name: regression
      color: e11d21
      description: Worked in a previous release and is broken now.
    - name: security
      color: e11d21
      description: A security problem.
    - name: feature
      color: c7def8
      description: A new capability.
    - name: documentation
      color: c7def8
      description: Documentation only.
    - name: cleanup
      color: c5def5
      description: Tech debt, refactoring, tests or process.

  # Public categorization: /area and /remove-area are available to any commenter.
  area:
    - name: desktop
      color: c2e0c6
      description: Desktop environment and shell.
    - name: flatpak
      color: c2e0c6
      description: Flatpak applications and runtimes.
    - name: gaming
      color: c2e0c6
      description: Gaming stack and Steam.
    - name: hardware
      color: c2e0c6
      description: Kernel, drivers, GPU and hardware support.
    - name: installer
      color: c2e0c6
      description: ISO installer and first-boot setup.
    - name: dx
      color: c2e0c6
      description: Developer experience and containers.

  # /triage accepted: the scope is accepted and the issue is ready for work
  triage:
    values:
      - name: accepted
        color: 8fc951
        description: Scope accepted; ready for work. Use `/triage accepted`.
    exclusive: true

  priority:
    values:
      - name: critical-urgent
        color: e11d21
        description: Drop other work for this. Use `/priority critical-urgent`.
      - name: important-soon
        color: eb6420
        description: Do this next. Use `/priority important-soon`.
    exclusive: true

  # /label blocked: waiting on something outside this repository (Hive skips it)
  labels:
    - name: blocked
      color: e11d21
      description: Waiting on something outside this repository. Use `/label blocked` or `/remove-label blocked`.

  # no lifecycle, stage or status labels: nothing acts on them
  lifecycle: []
  stage: []
  status: []

require_matching_label:
  - regexp: ^kind/
    missing_label: needs-kind
    issues: true
    prs: false
    missing_comment: "Please set a kind: `/kind bug`, `/kind feature`, `/kind cleanup`, `/kind documentation`, `/kind regression` or `/kind security`."
  - regexp: ^triage/
    missing_label: needs-triage
    issues: true
    prs: false
    missing_comment: "To accept this issue, comment `/triage accepted`. To categorize, comment `/area <area>` or `/kind <kind>`."
# `hold` is the label Hive already uses for its own holds; /hold applies the same label
hold:
  label: hold

tide:
  merge_method: squash
  merge_queue: auto

blunderbuss:
  request_count: 2
