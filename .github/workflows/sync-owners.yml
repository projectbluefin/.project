name: Sync OWNERS from maintainers.yaml

# Prow reads approvers from a root OWNERS file in each repository; upstream has no org-tier
# OWNERS yet. maintainers.yaml is the single list: when it changes, open a PR in every
# Prow repository that rewrites OWNERS from it. The PRs go through each repo's own review.

on:
  push:
    branches: [main]
    paths: [maintainers.yaml, .github/workflows/sync-owners.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-owners
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo:
          - common
          - chairlift
          - gutenprint-printer-app
          - hplip-printer-app
          - ps-printer-app
          - ghostscript-printer-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate mergeraptor app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          owner: projectbluefin
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a PR when OWNERS differs from maintainers.yaml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: projectbluefin/${{ matrix.repo }}
          BRANCH: chore/sync-owners
        run: |
          set -euo pipefail
          {
            echo '# Generated from projectbluefin/.project maintainers.yaml by sync-owners.yml.'
            echo '# Do not edit here: change maintainers.yaml in projectbluefin/.project.'
            echo 'approvers:'
            yq -r '.maintainers[].teams[] | select(.name == "project-maintainers") | .members[]' maintainers.yaml | sort -f | sed 's/^/  - /'
          } > OWNERS
          grep -q '^  - ' OWNERS || { echo "::error::no members found in maintainers.yaml"; exit 1; }

          base=$(gh api "repos/$REPO" --jq .default_branch)
          current=$(gh api "repos/$REPO/contents/OWNERS?ref=$base" --jq .content 2>/dev/null | base64 -d || true)
          if [ -z "$current" ]; then
            echo "$REPO has no OWNERS on $base yet (not on Prow); its cutover PR adds it"
            exit 0
          fi
          if [ "$current" = "$(cat OWNERS)" ]; then
            echo "OWNERS in $REPO is already up to date"
            exit 0
          fi

          base_sha=$(gh api "repos/$REPO/git/ref/heads/$base" --jq .object.sha)
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base_sha" >/dev/null
          fi
          file_sha=$(gh api "repos/$REPO/contents/OWNERS?ref=$BRANCH" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$REPO/contents/OWNERS" \
            -f message="chore: sync OWNERS from projectbluefin/.project maintainers.yaml" \
            -f content="$(base64 -w0 OWNERS)" \
            -f branch="$BRANCH" \
            ${file_sha:+-f sha="$file_sha"} >/dev/null

          if [ -z "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --repo "$REPO" --base "$base" --head "$BRANCH" \
              --title "chore: sync OWNERS from maintainers.yaml" \
              --body "Generated by projectbluefin/.project sync-owners.yml from \`maintainers.yaml\`. Prow uses OWNERS for /approve and reviewer requests."
          fi
