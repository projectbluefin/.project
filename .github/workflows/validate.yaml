name: Validate Project Metadata

on:
  pull_request:
    paths:
      - 'project.yaml'
      - 'maintainers.yaml'
      - 'prow.yaml'
      - '.github/workflows/validate.yaml'
      - '.github/workflows/sync-owners.yml'
      - 'scripts/validate-prow.mjs'
      - '.github/workflows/prow-authorize.yml'
      - 'scripts/prow-triage.cjs'
      - 'scripts/prow-transfer.cjs'
      - 'tests/prow-triage.test.cjs'
      - 'tests/prow-transfer.test.cjs'
      - '.github/workflows/prow-transfer.yml'
  push:
    branches: [main]
    paths:
      - 'project.yaml'
      - 'maintainers.yaml'
      - 'prow.yaml'
      - '.github/workflows/validate.yaml'
      - '.github/workflows/sync-owners.yml'
      - 'scripts/validate-prow.mjs'
      - '.github/workflows/prow-authorize.yml'
      - 'scripts/prow-triage.cjs'
      - 'scripts/prow-transfer.cjs'
      - 'tests/prow-triage.test.cjs'
      - 'tests/prow-transfer.test.cjs'
      - '.github/workflows/prow-transfer.yml'

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-project@979abb1e07fa1b6f2b4e77200f6a698cdd86e59c
        with:
          project_file: 'project.yaml'
          go_version: '1.27.1'

  validate-maintainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-maintainers@979abb1e07fa1b6f2b4e77200f6a698cdd86e59c
        with:
          maintainers_file: 'maintainers.yaml'
          verify_maintainers: 'false'
          go_version: '1.27.1'

  validate-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test tests/prow-triage.test.cjs tests/prow-transfer.test.cjs
      - name: Validate the canonical roster with the runtime authorization parser
        run: |
          yq -o=json '.' maintainers.yaml > maintainers.json
          printf '%s\n' '{}' > event.json
          node scripts/prow-triage.cjs event.json maintainers.json

  validate-prow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the reviewed production parser and lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cncf/prow-github-actions
          ref: a192ee15687d4ede4d553ff0929b2b296666afd7 # v3.5.0
          path: .prow-upstream
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install the pinned upstream dependencies without lifecycle scripts
        working-directory: .prow-upstream
        run: npm ci --ignore-scripts

      - name: Fetch the actual default-branch printer overrides as data
        run: |
          set -euo pipefail
          for repo in gutenprint-printer-app hplip-printer-app ps-printer-app ghostscript-printer-app; do
            mkdir -p "$RUNNER_TEMP/prow-overrides/$repo"
            curl --fail --silent --show-error --location --max-time 30 \
              "https://raw.githubusercontent.com/projectbluefin/$repo/main/.github/prow.yaml" \
              --output "$RUNNER_TEMP/prow-overrides/$repo/prow.yaml"
          done

      - name: Validate canonical and merged configurations with the production parser
        run: |
          .prow-upstream/node_modules/.bin/esbuild scripts/validate-prow.mjs \
            --bundle --platform=node --format=cjs --target=node24 \
            --outfile="$RUNNER_TEMP/validate-prow.cjs"
          node "$RUNNER_TEMP/validate-prow.cjs" prow.yaml "$RUNNER_TEMP"/prow-overrides/*/prow.yaml
