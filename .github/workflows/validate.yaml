name: Validate Project Metadata

on:
  pull_request:
    paths:
      - 'project.yaml'
      - 'maintainers.yaml'
      - 'prow.yaml'
      - '.github/workflows/prow-authorize.yml'
      - 'scripts/prow-triage.cjs'
      - 'scripts/prow-transfer.cjs'
      - 'tests/prow-triage.test.cjs'
      - 'tests/prow-transfer.test.cjs'
      - '.github/workflows/prow-transfer.yml'
  push:
    branches: [main]
    paths:
      - 'project.yaml'
      - 'maintainers.yaml'
      - 'prow.yaml'
      - '.github/workflows/prow-authorize.yml'
      - 'scripts/prow-triage.cjs'
      - 'scripts/prow-transfer.cjs'
      - 'tests/prow-triage.test.cjs'
      - 'tests/prow-transfer.test.cjs'
      - '.github/workflows/prow-transfer.yml'

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-project@979abb1e07fa1b6f2b4e77200f6a698cdd86e59c
        with:
          project_file: 'project.yaml'
          go_version: '1.27.1'

  validate-maintainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-maintainers@979abb1e07fa1b6f2b4e77200f6a698cdd86e59c
        with:
          maintainers_file: 'maintainers.yaml'
          verify_maintainers: 'false'
          go_version: '1.27.1'

  validate-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test tests/prow-triage.test.cjs tests/prow-transfer.test.cjs
      - name: Validate the canonical roster with the runtime authorization parser
        run: |
          yq -o=json '.' maintainers.yaml > maintainers.json
          printf '%s\n' '{}' > event.json
          node scripts/prow-triage.cjs event.json maintainers.json
